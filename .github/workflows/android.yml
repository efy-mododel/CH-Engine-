- uses: actions/checkout@v4
- uses: actions/setup-java@v4
  with:
    distribution: 'zulu'
    java-version: '17'
- run: chmod +x ./gradlew
- run: ./gradlew assembleRelease # Или assembleDebug
- uses: actions/upload-artifact@v4
  with:
    name: app-release
    path: app/build/outputs/apk/release/*.apk
